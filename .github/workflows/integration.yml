name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on develop.
    branches: [develop, 'ci/**']
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  EXAMPLE: flutter_secure_storage/example

jobs:
  # The example app's integration tests on each desktop platform. Linux needs
  # a keyring: gnome-keyring, unlocked on a new D-Bus session.
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      # The keychain of the sandboxed app (DebugProfile.entitlements).
      - uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          idle-minutes: 15
          working-directory: ${{ env.EXAMPLE }}
          run: flutter test -r expanded integration_test/app_test.dart -d macos
      # Diagnostics for a launch that never connects: is the app killed at
      # launch (AMFI, taskgated) or is the log reader the problem?
      - name: Diagnose macOS launch
        if: failure()
        working-directory: ${{ env.EXAMPLE }}
        run: |
          for app in build/macos/Build/Products/Debug/*.app; do
            echo "== $app"
            codesign -d --entitlements - "$app" 2>&1 || true
            codesign -dvv "$app" 2>&1 || true
            # Launch the binary directly; a launch killed by AMFI exits at once.
            "$app/Contents/MacOS/"* > direct-run.log 2>&1 &
            pid=$!
            sleep 15
            if kill -0 "$pid" 2>/dev/null; then
              echo "direct run: still running after 15s"
              kill "$pid" 2>/dev/null || true
            else
              wait "$pid"; echo "direct run: exited with $?"
            fi
            tail -20 direct-run.log || true
          done
          log show --last 3m --predicate 'process == "amfid" OR process == "taskgated" OR eventMessage CONTAINS "AMFI"' 2>&1 \
            | grep -i "example\|AMFI\|taskgated" | tail -150 || true

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      - name: Test flutter_secure_storage_windows
        working-directory: flutter_secure_storage_windows
        run: flutter test -r expanded
      - uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          idle-minutes: 15
          working-directory: ${{ env.EXAMPLE }}
          run: flutter test -r expanded integration_test/windows_test.dart -d windows

  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies and gnome-keyring
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev \
            gnome-keyring dbus-x11 xvfb
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      # A fresh D-Bus session with an unlocked login keyring (empty password).
      - uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          idle-minutes: 15
          working-directory: ${{ env.EXAMPLE }}
          run: |
            dbus-run-session -- bash -c '
              echo "" | gnome-keyring-daemon --unlock --daemonize --components=secrets
              xvfb-run -a flutter test -r expanded integration_test/linux_test.dart -d linux
            '

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: emulator
      - uses: Telosnex/telosnex_ci_tools/actions/watch@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          idle-minutes: 15
          working-directory: ${{ env.EXAMPLE }}
          run: flutter test -r expanded integration_test/app_test.dart -d emulator-5554
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: simulator
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          target: integration_test/app_test.dart
          working-directory: ${{ env.EXAMPLE }}
          udid: ${{ steps.simulator.outputs.udid }}
          args: --dart-define=IS_SIMULATOR=true

  # The same tests in Chrome, through flutter drive and the web driver.
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
      - uses: Telosnex/telosnex_ci_tools/actions/web-driver@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          browser: chrome
          artifact-name: web-chrome-dart2js-logs
          working-directory: ${{ env.EXAMPLE }}
          require-result: '.telosnexWebTestSummary.passed >= 8'
          run: |
            flutter drive --driver=test_driver/integration_test.dart \
              --target=integration_test/web_test.dart \
              -d web-server --browser-name chrome
