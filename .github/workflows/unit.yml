name: Unit

on:
  pull_request:
    branches: [develop]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on develop.
    branches: [develop, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - uses: Telosnex/telosnex_ci_tools/actions/lint@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      # One pub workspace at the root: every package and the example.
      - run: flutter pub get
      # Generated files (first line "// GENERATED ...") keep their generator's
      # layout.
      - run: |
          git ls-files '*.dart' |
            while read -r f; do head -1 "$f" | grep -qiE '^// *generated' || echo "$f"; done |
            xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos flutter_secure_storage flutter_secure_storage/example flutter_secure_storage_web flutter_secure_storage_windows
      - name: Test flutter_secure_storage
        working-directory: flutter_secure_storage
        run: flutter test -r expanded
      # The web package's tests are browser tests (@TestOn('browser')).
      - name: Test flutter_secure_storage_web in Chrome
        working-directory: flutter_secure_storage_web
        run: flutter test -r expanded --platform chrome
